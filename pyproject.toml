[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velum-mcp"
version = "1.0.0"
description = "VELUM by Abogado Virtual — Legal Document Anonymization & Privacy MCP (local-first, sin IA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abogado Virtual" }]
keywords = ["mcp", "rgpd", "gdpr", "anonimizacion", "legal", "privacidad"]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
velum-mcp = "velum.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/velum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
